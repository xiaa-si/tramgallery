<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tram Gallery – Kolkata Sketches</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Font – simple and free -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tram Gallery</h1>
        <p>Hand‑sketched Kolkata trams & colonial architecture</p>
    </header>

    <main class="gallery">
        <!-- Tram sketch 1 -->
        <figure class="item" data-desc="The iconic 1930s electric tram that still runs on Chowringhee Road.">
            <img src="tram1.svg" alt="Sketch of a Kolkata tram">
        </figure>

        <!-- Tram sketch 2 -->
        <figure class="item" data-desc="A vintage tram with open windows, often seen near the Howrah Bridge.">
            <img src="tram2.svg" alt="Sketch of a vintage Kolkata tram">
        </figure>

        <!-- Colonial building sketch -->
        <figure class="item" data-desc="The grand Raj Bhavan, a reminder of British colonial architecture.">
            <img src="building1.svg" alt="Sketch of a colonial building">
        </figure>
    </main>

    <footer>
        <p>© 2026 tramgallery – handcrafted with love.</p>
    </footer>
</body>
</html>
