<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tram Gallery – Kolkata Sketches</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Font – simple and free -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Site header -->
    <header>
        <h1>Tram Gallery</h1>
        <p>Hand‑sketched Kolkata trams & colonial architecture</p>
        <button id="theme-toggle" aria-label="Toggle dark mode" type="button">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </header>

    <!-- Main content area -->
    <main>
        <!-- Gallery section – holds all sketches -->
        <section class="gallery" aria-label="Tram and building sketches">
            <!-- Each sketch is an article for better semantics -->
            <article class="item" data-desc="The iconic 1930s electric tram that still runs on Chowringhee Road.">
                <figure>
                    <img src="tram1.svg" alt="Sketch of a Kolkata tram">
                    <figcaption>Tram 1</figcaption>
                </figure>
            </article>

            <article class="item" data-desc="A vintage tram with open windows, often seen near the Howrah Bridge.">
                <figure>
                    <img src="tram2.svg" alt="Sketch of a vintage Kolkata tram">
                    <figcaption>Tram 2</figcaption>
                </figure>
            </article>

            <article class="item" data-desc="The grand Raj Bhavan, a reminder of British colonial architecture.">
                <figure>
                    <img src="building1.svg" alt="Sketch of a colonial building">
                    <figcaption>Raj Bhavan</figcaption>
                </figure>
            </article>
        </section>
    </main>

    <!-- Site footer -->
    <footer>
        <p>© 2026 tramgallery – handcrafted with love.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
